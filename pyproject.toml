[project]
name = "ai-event-system"
version = "1.0.0"
description = "AI Event Driven System"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
    "alembic>=1.15.2",
    "anthropic>=0.49.0",
    "celery>=5.5.1",
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.12",
    "firecrawl-py>=4.28.2",
    "instructor>=1.7.9",
    "mcp>=1.2.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.3",
    "pydantic-ai>=0.1.5",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.1.0",
    "python-frontmatter>=1.1.0",
    "redis>=5.2.1",
    "tavily-python>=0.7.26",
    "tiktoken>=0.9.0",
    "trafilatura>=2.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "uvicorn>=0.34.2",
    "voyageai>=0.4.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "freezegun>=1.5",
    "graphviz>=0.20.3",
    "httpx>=0.27",
    "ipykernel>=6.29.5",
    "ipython>=9.2.0",
    "nest-asyncio>=1.6.0",
    "pylint>=3.0.0",
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-env>=1.1",
    "pytest-mock>=3.14",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.9",
]

[tool.ruff]
exclude = [
    ".venv",
    "app/core/commands",
    "app/alembic",
    ".sh",
    "app/workflows/customer_care_workflow.py",
    "app/workflows/customer_care_workflow_nodes",
    "app/schemas/customer_care_schema.py",
    "tests/brain/fixtures/code",
]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
]
ignore = [
    "E501",   # line too long — pylint owns this with its own limit
    "B008",   # Depends() in arg defaults — standard FastAPI dependency injection pattern
]

[tool.pylint.main]
ignore-paths = [
    "app/alembic",
    "app/core/commands",
    "app/workflows/customer_care_workflow",
    "app/schemas/customer_care_schema",
]

[tool.pylint.design]
max-returns = 10
# RetrieveChunksNode.retrieve()/_semantic_search() carry the hybrid-retrieval
# contract: query, corpus, k, threshold, filters, include_archived. Each is a
# real, independent parameter (the brain-rag-improvements plan deliberately chose
# an explicit include_archived flag over overloading filters). Raised 6 → 7 to
# accommodate, continuing the precedent the frontmatter-retrieval-filters spec set.
# app.brain.ingest.ingest_artifact's public signature is pinned by the OR.Q /
# ticket-corpus-reconcile task specs (session + artifact_id, doc_type,
# content, section, project, title, description, metadata, authored_at) — 10
# real, independent parameters, each keyword-only after session so
# positional-arguments stays at 6. Raised 7 -> 8 -> 9 continuing the
# precedent the frontmatter-retrieval-filters spec set; OR.3.A task 1 raised
# 9 -> 10 to add `metadata`, the merged LearningArtifact/caller-supplied
# context dict engine-rs's content-pipeline payload carries (accepted for
# forward compatibility; not yet persisted to a dedicated column — see the
# parameter's docstring). _upsert_chunk mirrors the earlier growth (adds
# embedding_model + authored_at alongside the existing per-chunk write
# fields). max-locals follows suit: the function's own bookkeeping
# (file_path, attribution, context_prefix, embedding_svc, final_chunks,
# embed_texts, embeddings, chunks_written, plus the per-chunk loop vars, plus
# the now-unused `metadata` parameter binding) pushes past the default 15
# without indicating real complexity.
max-args = 10
max-positional-arguments = 6
max-locals = 21

[tool.pylint.format]
# app/brain/cli.py is the single `syn` argparse dispatcher (D52) — every
# subcommand's parser wiring, dispatch function, and rendering helpers live
# in this one file by design (mirrors `_build_parser`'s own docstring:
# "recall, walk, pulse, ..., queries"). OR.2.E's `queries mine` subcommand
# (a proper subparser plus its fail-loud YAML-fragment renderer) pushed the
# module past the default 1000-line ceiling; splitting it would scatter one
# command's parser/dispatch/render triplet across files for no functional
# gain. Raised 1000 -> 1200 with headroom for the next subcommand.
max-module-lines = 1200

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "pointless-string-statement",  # docstrings placed after imports — cosmetic, not bugs
]

[project.scripts]
createworkflow = "app.core.commands.init_workflow:main"
syn = "app.brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true
