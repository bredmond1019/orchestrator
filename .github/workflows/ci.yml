name: ci

# Thin caller — invokes base-template's reusable Python (uv) gate workflow,
# which mirrors this repo's planning/harness.json checks in declared order
# (standing-rules scan, db-session-import, db-repository-import, ruff,
# pylint, pytest-count, pytest). See base-template/docs/ci.md for the
# opt-in model and the local actionlint -> act -> push validation loop.

on:
  push:
  pull_request:

jobs:
  gate:
    uses: bredmond1019/agentic-base-template/.github/workflows/gate-python-uv.yml@main
